name: Release checks

# Быстрые проверки кода. НЕ собирает и НЕ публикует артефакты.
# Сборка и публикация релиза — в release.yml (только по тегу v*).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            XMSGi Studio/package-lock.json
            Studio/Studio module/package-lock.json

      - name: Install dependencies
        working-directory: XMSGi Studio
        run: npm ci

      - name: Install Studio module dependencies
        run: npm --prefix "Studio/Studio module" ci

      - name: Lint
        working-directory: XMSGi Studio
        run: npm run lint

      - name: Typecheck
        working-directory: XMSGi Studio
        run: npm run typecheck

      - name: Test
        working-directory: XMSGi Studio
        run: npm test -- --reporter=dot

      - name: Studio module typecheck
        run: npm --prefix "Studio/Studio module" run typecheck

      - name: Studio module tests
        run: npm --prefix "Studio/Studio module" test -- --reporter=dot

      - name: Studio module build
        run: npm --prefix "Studio/Studio module" run build